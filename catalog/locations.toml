# Where the dumps and the catalogue pages are (judaicalink-data decision 0014). Entries and -meta files never name
# these; a location is a prefix: dumps + <slug>/<version>/<path>, catalogues + <slug>/. Read by `cr update-dataindex`.
# Planned (decision 0002 of confref-data); nothing is published there yet.

[dumps]
site = "https://confref.org/dumps/"          # the project website
labs = "https://labs.confref.org/dumps/"     # the showcase VM (the files of the loaded versions)

[catalogues]
site = "https://confref.org/datasets/"
