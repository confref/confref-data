# Where the dumps and the catalogue pages are (kg-commons 0014). Entries and -meta files never name
# these; a location is a prefix: dumps + <slug>/<version>/<path>, catalogues + <slug>/. Read by `cr update-dataindex`.
# On bart until the VMs exist (decision 0015); the showcase VM labs.confref.org (decision 0007) comes later.

[dumps]
archive = "https://archive.confref.org/store/"   # the store, without tuwien-pc (decision 0015)

[catalogues]
site = "https://www.confref.org/datasets/"
