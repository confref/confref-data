# The agents of confref (format of judaicalink-data decision 0018).
#
# Persons: [persons.<n>], numbered in sequence, never reused; IRI https://id.confref.org/datasets/agents/persons/<n>.
#   name       the name as used in the catalogue (author, version author, changelog author)
#   links      optional list of URLs about the person (ORCID, website)
#   withdrawn  instead of name and links, if the person objected to being named: date and reason; the IRI stays
# Software: [software.<name>]; IRI https://id.confref.org/datasets/agents/software/<name>.
#   label, url
#
# The names are published only in the dataset confref-agents, which is generated from this file; the -meta files
# name agents by IRI. `cr check-catalog` checks that every name in the catalogue is here.

[persons.1]
name = "Kai Eckert"

[software.confref-data]
label = "confref-data: the confref data generator framework"
url = "https://github.com/confref/confref-data"
