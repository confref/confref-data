# The measured quality of the identity links per dataset, property and target source (kg-commons
# 0032). A unit joins records (linksets, identifiers) if accuracy >= 0.95 and, when only a sample was checked, the
# lower bound of its 95% interval >= 0.90; below, it is linked but joins nothing. Units not measured join. Made from
# the verdicts of the report named in each entry.

accuracy = 0.95
lower = 0.90

[[unit]]
dataset = "confident"
property = "cf:DBLP_Series_ID"
source = "dblp-venue"
accuracy = 0.990
lower = 0.946
upper = 0.998
correct = 99
wrong = 1
undecidable = 0
links = 606
sample = 100
report = "docs/reports/2026-11-09-link-quality.md"

