# Local settings of cr. Copy to local.toml (not committed) and adjust.
# Paths are relative to the repository root; ../lokal is the workspace link to ~/lokal/confref (not synced).

store = "../lokal/store"              # the store: the files of every version, <slug>/<version>/<path>
internal_store = "../lokal/internal"  # the versions of internal datasets (decision 0023), never published
build = "../lokal/build"              # build area: <slug>/<run-id>/
# cache = "../lokal/build/.cache"     # canonical forms, by file checksum (default: <build>/.cache)
inputs = "../lokal/inputs"            # the inputs area: <source>/<name>/ with input.toml
work = "../lokal/work"                # work files: harvests in progress, logs

# User-Agent per host, where a source needs another one than the default of project.toml:
# [user_agent]
# "example.org" = "..."
