name: Feedback on the data
description: Something in the confref data is wrong or missing (filled in by the Feedback button of labs.confref.org)
title: "Feedback: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your feedback. It is public here, so that others can follow it.

        Feedback of any kind is welcome, above all on how confref links records and groups them into series and
        events. An error in a record of a source is best also corrected at the source; the ways to report to each
        source (ConfIDent, Wikidata, dblp, the GND) are listed at https://www.confref.org/feedback/. Missing
        conferences are added to ConfIDent (https://www.confident-conference.org/index.php/ANNOUNCE), not to confref.
  - type: input
    id: iri
    attributes:
      label: About
      description: The confref resource the feedback is about (a series, an event, a record or a dataset).
      placeholder: https://id.confref.org/event/…
  - type: input
    id: page
    attributes:
      label: Page
      description: Where you saw it.
  - type: textarea
    id: quote
    attributes:
      label: Selected text
      description: The text on the page the feedback is about.
  - type: textarea
    id: description
    attributes:
      label: Feedback
      description: What is wrong, and what should it be? Sources and examples help.
    validations:
      required: true
